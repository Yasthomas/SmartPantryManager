plugins {
    id 'com.android.application'
}

android {
    namespace 'com.thomas.smartpantrymanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.thomas.smartpantrymanager"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // The assignment values readability over shrinking: no code obfuscation is applied.
            minifyEnabled false
        }
    }

    // JDK 17 language level: the project builds with the JDK bundled with Android Studio.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.room:room-runtime:2.6.1"
    // Java annotation processing (not KSP/kapt): there is no Kotlin in this project.
    annotationProcessor "androidx.room:room-compiler:2.6.1"
}
